agent:
  seed: 42
  device: cuda:0
  num_steps_per_env: 48
  max_iterations: 20
  empirical_normalization: false
  obs_groups: {}
  clip_actions: null
  check_for_nan: true
  save_interval: 2
  experiment_name: g1_stand_coordination_v1
  run_name: ''
  logger: tensorboard
  neptune_project: isaaclab
  wandb_project: isaaclab
  resume: false
  load_run: .*
  load_checkpoint: model_.*.pt
  class_name: OnPolicyRunner
  actor:
    class_name: softmimic_gym.rsl_rl_extensions.models:StandCoordinationArmWaistCOMResidualAdapterMLPModel
    hidden_dims:
    - 512
    - 512
    - 256
    - 128
    activation: elu
    obs_normalization: false
    distribution_cfg:
      class_name: GaussianDistribution
      init_std: 0.01
      std_type: scalar
    stochastic: {}
    init_noise_std: {}
    noise_std_type: scalar
    state_dependent_std: false
  critic:
    class_name: MLPModel
    hidden_dims:
    - 512
    - 512
    - 512
    - 256
    activation: elu
    obs_normalization: false
    distribution_cfg: null
    stochastic: {}
    init_noise_std: {}
    noise_std_type: scalar
    state_dependent_std: false
  algorithm:
    class_name: PPO
    num_learning_epochs: 1
    num_mini_batches: 4
    learning_rate: 2.0e-05
    schedule: fixed
    gamma: 0.99
    lam: 0.95
    entropy_coef: 0.0
    desired_kl: 0.001
    max_grad_norm: 0.5
    optimizer: adam
    value_loss_coef: 1.0
    use_clipped_value_loss: true
    clip_param: 0.03
    normalize_advantage_per_mini_batch: false
    share_cnn_encoders: false
    rnd_cfg: null
    symmetry_cfg: null
  policy:
    class_name: ActorCritic
    init_noise_std: 0.02
    noise_std_type: scalar
    state_dependent_std: false
    actor_obs_normalization: {}
    critic_obs_normalization: {}
    actor_hidden_dims:
    - 512
    - 512
    - 256
    - 128
    critic_hidden_dims:
    - 512
    - 512
    - 512
    - 256
    activation: elu
  actor_output_finetune_action_ids: null
  bilateral_structured_arm_adapter_only: false
  proximal_arm_waist_adapter_only: true
